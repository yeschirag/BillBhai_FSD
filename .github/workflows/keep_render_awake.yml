name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Render Backend
        run: |
          curl -fsS https://billbhai-fsd.onrender.com/health \
          || curl -fsS https://billbhai-fsd.onrender.com/ \
          || true
