name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"   # Every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render Backend
        run: |
          curl --silent --show-error --fail \
          https://billbhai-fsd.onrender.com/health \
          || curl --silent --show-error --fail \
          https://billbhai-fsd.onrender.com/ \
          || true
